<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>本地经营账本</title>
<style>
:root{--bg:#eef4ef;--panel:#ffffffea;--ink:#15352b;--muted:#71857b;--line:#d7e5dc;--brand:#16634c;--brand2:#dff3e7;--warn:#fff0c4;--danger:#b23b35;--shadow:0 20px 55px #15352b14}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7faf7 0,#e8f2eb 48%,#f5f8f5 100%);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Microsoft YaHei",sans-serif;min-height:100vh}body:before,body:after{content:"";position:fixed;width:42vw;height:42vw;border-radius:50%;filter:blur(55px);opacity:.22;pointer-events:none;z-index:-1}body:before{background:#bfe5ce;left:-18vw;top:-16vw}body:after{background:#d7e8c5;right:-20vw;bottom:-20vw}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:1100px;margin:auto;padding:22px 16px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{display:flex;gap:12px;align-items:center}.mark{width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,#2f9872,#0e4636);color:#fff;display:grid;place-items:center;font-size:23px;box-shadow:0 12px 28px #17644c35;position:relative;overflow:hidden}.mark:after{content:"";position:absolute;inset:-50%;background:linear-gradient(110deg,transparent 40%,#ffffff55 50%,transparent 60%);animation:sheen 5s infinite}.title{font-weight:850;font-size:23px;letter-spacing:.3px}.subtitle{font-size:12px;color:var(--muted)}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{background:linear-gradient(135deg,#1e785b,#12523f);color:#fff;padding:11px 15px;border-radius:12px;font-weight:750;box-shadow:0 7px 18px #1d6b5228;transition:transform .2s,box-shadow .2s}.btn:hover{transform:translateY(-2px);box-shadow:0 11px 23px #1d6b5238}.btn:active{transform:translateY(0)}.btn.ghost{background:#ffffffbf;color:var(--brand);border:1px solid var(--line);box-shadow:none}.btn.warn{background:#9b6a11}.btn.danger{background:#a63a36}.grid{display:grid;grid-template-columns:1.05fr 1.95fr;gap:18px}.panel{background:var(--panel);border:1px solid #ffffff; border-radius:22px;padding:19px;box-shadow:var(--shadow);backdrop-filter:blur(16px);animation:rise .5s ease both}.panel h2{font-size:18px;margin:0 0 12px}.panel h3{font-size:15px;margin:18px 0 8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:linear-gradient(145deg,#e7f6ec,#d8eee2);border:1px solid #d1eadb;border-radius:15px;padding:13px;transition:transform .2s}.stat:hover{transform:translateY(-3px)}.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:var(--muted)}.list{display:grid;gap:9px;margin-top:12px}.item{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fffffff0;display:flex;justify-content:space-between;gap:10px;align-items:center;transition:border-color .2s,transform .2s}.item:hover{transform:translateY(-1px);border-color:#9bcbb0}.item.active{border-color:var(--brand);box-shadow:0 0 0 3px #1d6b5218}.item-title{font-weight:750}.item-sub{font-size:12px;color:var(--muted)}.item-actions{display:flex;gap:6px;flex-wrap:wrap}.icon-btn{background:#eaf5ed;color:var(--brand);border-radius:9px;padding:8px 10px;font-weight:700}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{white-space:nowrap;background:#edf5ef;color:#28634e;padding:9px 12px;border-radius:10px;transition:.2s}.tab:hover{background:#d9eee1}.tab.on{background:linear-gradient(135deg,#1e785b,#12523f);color:#fff;box-shadow:0 5px 14px #1d6b5228}.form{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fbfefb;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px #1d6b5215}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.empty{padding:28px 10px;text-align:center;color:var(--muted)}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#e8f1eb;color:#2b6c54;font-size:12px}.due{background:var(--warn);color:#875b08;border-color:#f0d995}.money{font-variant-numeric:tabular-nums}.notice{font-size:12px;color:var(--muted);background:#f5f8f5;border-radius:10px;padding:10px}.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.media{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#f7faf7}.media img,.media video{width:100%;height:110px;object-fit:cover;display:block}.media small{display:block;padding:6px;color:var(--muted)}dialog{border:0;border-radius:18px;width:min(560px,calc(100% - 26px));padding:0;box-shadow:0 30px 80px #18352c38}dialog::backdrop{background:#0d241c55}.modal{padding:20px}.modal h2{margin-top:0}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes sheen{0%,65%{transform:translateX(-80%) rotate(15deg)}100%{transform:translateX(180%) rotate(15deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(max-width:800px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.top{align-items:flex-start;flex-direction:column}.top-actions{width:100%}.top-actions .btn{flex:1}}@media(max-width:460px){.app{padding:12px 10px 30px}.panel{padding:14px;border-radius:16px}.row{grid-template-columns:1fr}.stats{gap:6px}.stat{padding:9px}.stat b{font-size:18px}.btn{padding:10px 11px}}
</style>
<style>
body.dark{--bg:#101a17;--panel:#17251fef;--ink:#eaf5ed;--muted:#9bb0a5;--line:#2a4035;--brand2:#1e3a2e;--shadow:0 20px 55px #0008;background:linear-gradient(135deg,#0e1815,#17251f 48%,#0d1713)}
body.dark .panel,body.dark .item{background:#17251fed}body.dark .btn.ghost{background:#1d2d26;color:#b9e4c9;border-color:#365142}body.dark .field input,body.dark .field select,body.dark .field textarea{background:#14211b;color:var(--ink)}body.dark .notice{background:#1d2d26}body.dark .tab{background:#20392d;color:#b9e4c9}.media{transition:transform .2s}.media:hover{transform:translateY(-3px)}
#ambient{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.72;display:block}.gray{filter:grayscale(1)}
.tabs .tab:nth-child(1){--tab:#1d6b52}.tabs .tab:nth-child(2){--tab:#4778a8}.tabs .tab:nth-child(3){--tab:#a26a27}.tabs .tab:nth-child(4){--tab:#9a4d65}.tabs .tab:nth-child(5){--tab:#6951a5}.tabs .tab.on{background:linear-gradient(135deg,var(--tab,#1e785b),#123b31)}
</style>
</head>
<body>
<canvas id="ambient" aria-hidden="true"></canvas>
<main class="app" style="position:relative;z-index:1">
<header class="top"><div class="brand"><button class="mark" id="aboutBtn" title="查看账本说明">账</button><div><div class="title">本地经营账本</div><div class="subtitle">收入、支出、欠款和项目利润，一眼看懂</div></div></div><div class="top-actions"><button class="btn ghost" id="moreBtn" title="打开管理设置">＋ 设置</button></div></header>
<section class="grid"><aside class="panel"><h2>我的地块</h2><div class="notice">每笔钱都先选地块，账目才不会混在一起。</div><div class="actions"><button class="btn" id="addPlotBtn">+ 新建地块</button></div><div class="list" id="plotList"></div></aside>
<section class="panel"><div id="main"></div></section></section>
</main>
<dialog id="plotDialog"><div class="modal"><h2>新建地块</h2><form class="form" id="plotForm"><div class="row"><div class="field"><label>地块名称 *</label><input name="name" placeholder="例如：那马山一号" required></div><div class="field"><label>地点</label><input name="location" placeholder="村、屯或山名"></div></div><div class="row"><div class="field"><label>签约日期</label><input type="date" name="date"></div><div class="field"><label>地块状态</label><select name="status"><option>待开发</option><option>待采伐</option><option>正在采伐</option><option>采伐完毕</option></select></div></div><div class="row"><div class="field"><label>林木购置/承包款</label><input type="number" min="0" step="0.01" name="purchase" placeholder="元"></div><div class="field"><label>已付定金或押金</label><input type="number" min="0" step="0.01" name="deposit" placeholder="元"></div></div><div class="row"><div class="field"><label>山主姓名</label><input name="owner" placeholder="选填"></div><div class="field"><label>合同编号</label><input name="contractNo" placeholder="选填"></div></div><div class="field"><label>合同/手续备注</label><textarea name="note" rows="3" placeholder="例如：尾款约定、许可证办理情况"></textarea></div><div class="actions"><button class="btn" type="submit">保存地块</button><button class="btn ghost" type="button" onclick="plotDialog.close()">取消</button></div></form></div></dialog>
<dialog id="mediaDialog"><div class="modal"><h2>添加现场照片或视频</h2><div class="notice">文件只保存在这台设备的浏览器里，不会上传服务器。视频建议选择短视频。</div><form class="form" id="mediaForm"><div class="field"><label>选择照片或视频</label><input type="file" name="file" accept="image/*,video/*" required></div><div class="field"><label>说明</label><input name="note" placeholder="例如：装车现场、合同现场、砍伐进度"></div><div class="actions"><button class="btn" type="submit">保存到本地</button><button class="btn ghost" type="button" onclick="mediaDialog.close()">取消</button></div></form></div></dialog>
<dialog id="moreDialog"><div class="modal"><h2>更多设置</h2><div class="list"><button class="item" id="themeBtn"><span>切换浅色 / 深色</span><span>◐</span></button><button class="item" id="paletteBtn"><span>调整强调颜色</span><span>●</span></button><button class="item" id="backgroundBtn"><span>背景开关</span><span>动态</span></button><button class="item" id="exportBtn"><span>导出备份</span><span>↓</span></button><button class="item" id="importBtn"><span>导入备份</span><span>↑</span></button><button class="item" onclick="view='settings';moreDialog.close();render()"><span>设置与年度统计</span><span>→</span></button></div><input id="accentPicker" type="color" value="#16634c" hidden><input id="importFile" type="file" accept="application/json" hidden><div class="actions"><button class="btn ghost" type="button" onclick="moreDialog.close()">关闭</button></div></div></dialog>
<dialog id="aboutDialog"><div class="modal"><h2>本地经营账本</h2><div class="notice">这是一个离线账本，帮助你记录项目收入、支出、欠款和利润。文字保存在本机浏览器，不上传服务器。</div><div class="list"><div class="item"><span>版本</span><strong>1.0.0</strong></div><div class="item"><span>今年已收</span><strong id="aboutIncome">¥0.00</strong></div><div class="item"><span>今年已付</span><strong id="aboutPaid">¥0.00</strong></div><div class="item"><span>记录方式</span><strong>本地保存</strong></div></div><div class="actions"><button class="btn ghost" type="button" onclick="aboutDialog.close()">关闭</button></div></div></dialog>
<script>
document.addEventListener('DOMContentLoaded',()=>{const about=document.getElementById('aboutBtn');if(about)about.onclick=()=>{const y=String(new Date().getFullYear()),income=dbData.sales.filter(x=>String(x.date||'').startsWith(y)).reduce((a,x)=>a+Number(x.received||0),0),paid=dbData.expenses.filter(x=>String(x.date||'').startsWith(y)).reduce((a,x)=>a+Number(x.amount||0),0)+dbData.workers.filter(x=>String(x.date||'').startsWith(y)).reduce((a,x)=>a+Number(x.paid||0),0)+dbData.trucks.filter(x=>String(x.date||'').startsWith(y)).reduce((a,x)=>a+Number(x.paid||0),0);document.getElementById('aboutIncome').textContent=money(income);document.getElementById('aboutPaid').textContent=money(paid);document.getElementById('aboutDialog').showModal()}});
const KEY='shanmu-ledger-v1';let dbData=JSON.parse(localStorage.getItem(KEY)||'{"plots":[],"expenses":[],"workers":[],"trucks":[],"sales":[],"media":[]}');let selectedId=dbData.plots[0]?.id||null,view='home';const themeKey='shanmu-theme';if(localStorage.getItem(themeKey)==='dark')document.body.classList.add('dark');if(localStorage.getItem('shanmu-accent'))document.documentElement.style.setProperty('--brand',localStorage.getItem('shanmu-accent'));
const $=s=>document.querySelector(s), money=n=>'¥'+Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}), today=()=>new Date().toISOString().slice(0,10), id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random(), stamp=()=>new Date().toISOString(), recordNo=()=>`R${new Date().toISOString().replace(/[-:TZ.]/g,'').slice(0,14)}-${Math.floor(Math.random()*900+100)}`;
function save(){localStorage.setItem(KEY,JSON.stringify(dbData));render()};function plot(){return dbData.plots.find(x=>x.id===selectedId)};function sums(p){let ex=dbData.expenses.filter(x=>x.plotId===p.id).reduce((a,x)=>a+Number(x.amount||0),0);let wo=dbData.workers.filter(x=>x.plotId===p.id).reduce((a,x)=>a+Number(x.paid||0),0);let tr=dbData.trucks.filter(x=>x.plotId===p.id).reduce((a,x)=>a+Number(x.paid||0),0);let sa=dbData.sales.filter(x=>x.plotId===p.id).reduce((a,x)=>a+Number(x.total||0),0);let due=dbData.sales.filter(x=>x.plotId===p.id).reduce((a,x)=>a+Math.max(0,Number(x.total||0)-Number(x.received||0)),0);return{cost:ex+wo+tr+Number(p.purchase||0)+Number(p.deposit||0),income:sa,due,profit:sa-(ex+wo+tr+Number(p.purchase||0)+Number(p.deposit||0))}};
function render(){const list=$('#plotList');list.innerHTML=dbData.plots.length?dbData.plots.map(p=>`<div class="item ${p.id===selectedId?'active':''}"><div onclick="selectedId='${p.id}';view='home';render()"><div class="item-title">${esc(p.name)}</div><div class="item-sub">${esc(p.location||'未填地点')} · ${esc(p.status)}</div></div><div class="item-actions"><button class="icon-btn" onclick="selectedId='${p.id}';view='home';render()">查看</button><button class="icon-btn" onclick="removePlot('${p.id}')">删除</button></div></div>`).join(''):'<div class="empty">还没有项目<br>先新建第一个项目</div>';const p=plot();$('#main').innerHTML=p?mainHtml(p):(view==='settings'?settingsView():'<div class="empty"><h2>先建立第一个项目</h2><p>项目可以是杉木地块、工程、运输单或其他生意。</p><button class="btn" onclick="plotDialog.showModal()">新建第一个项目</button><button class="btn ghost" onclick="view=\'settings\';render()">打开设置</button></div>');}
function removePlot(pid){if(!confirm('删除这块地及其支出、工人、运输、销售和媒体记录？'))return;dbData.plots=dbData.plots.filter(x=>x.id!==pid);['expenses','workers','trucks','sales','media'].forEach(k=>dbData[k]=dbData[k].filter(x=>x.plotId!==pid));selectedId=dbData.plots[0]?.id||null;save()}
function mainHtml(p){let s=sums(p);return `<div class="tabs"><button class="tab ${view==='home'?'on':''}" onclick="view='home';render()">首页</button><button class="tab ${view==='add'?'on':''}" onclick="view='add';render()">记一笔</button><button class="tab ${view==='accounting'?'on':''}" onclick="view='accounting';render()">查账</button><button class="tab ${view==='media'?'on':''}" onclick="view='media';render()">资料</button></div>${view==='home'?overview(p,s):view==='add'?addHub(p):view==='accounting'?accountingView(p):view==='media'?mediaView(p):view==='settings'?settingsView():view==='profile'?profileView():view==='expense'?expenseForm(p):view==='work'?workForm(p):view==='sale'?saleForm(p):overview(p,s)}`}
function addHub(p){return `<h2>记一笔</h2><div class="notice">只选择你现在要记录的事情，保存后会自动进入项目账目。</div><div class="list"><button class="item" onclick="view='expense';render()"><div><div class="item-title">记花费</div><div class="item-sub">油费、材料、办证、维修或其他支出</div></div><span>→</span></button><button class="item" onclick="view='work';render()"><div><div class="item-title">记工资或运输</div><div class="item-sub">记录应付、已付和还欠</div></div><span>→</span></button><button class="item" onclick="view='sale';render()"><div><div class="item-title">记收入</div><div class="item-sub">卖货、收款和待收尾款</div></div><span>→</span></button><button class="item" onclick="openMedia('${p.id}')"><div><div class="item-title">存资料</div><div class="item-sub">保存照片或视频，留作现场凭证</div></div><span>→</span></button></div>`}
function accountingView(p){let s=sums(p),now=new Date(),m=now.getMonth(),y=now.getFullYear();let monthEx=dbData.expenses.filter(x=>x.plotId===p.id&&new Date(x.date||x.createdAt||0).getMonth()===m&&new Date(x.date||x.createdAt||0).getFullYear()===y).reduce((a,x)=>a+Number(x.amount||0),0);let monthIn=dbData.sales.filter(x=>x.plotId===p.id&&new Date(x.date||x.createdAt||0).getMonth()===m&&new Date(x.date||x.createdAt||0).getFullYear()===y).reduce((a,x)=>a+Number(x.received||0),0);return `<h2>查账</h2><div class="notice">${y}年${m+1}月：这个月花了多少、收了多少；项目总账：投入、收入和利润。</div><div class="stats"><div class="stat"><span>本月花费</span><b>${money(monthEx)}</b></div><div class="stat"><span>本月已收</span><b>${money(monthIn)}</b></div><div class="stat"><span>项目利润</span><b>${money(s.profit)}</b></div></div><div class="list"><div class="item"><div><div class="item-title">项目总投入</div><div class="item-sub">包括项目款、支出、工资和运输</div></div><strong>${money(s.cost)}</strong></div><div class="item"><div><div class="item-title">项目总收入</div><div class="item-sub">按销售总额计算</div></div><strong>${money(s.income)}</strong></div><div class="item ${s.due>0?'due':''}"><div><div class="item-title">还没收到</div><div class="item-sub">销售尾款</div></div><strong>${money(s.due)}</strong></div></div><h3>资金变化</h3><div class="notice">收入 − 投入 = 账面利润。软件负责准确计算，漏填或填错金额会影响结果。</div>`}
function settingsView(){let y=new Date().getFullYear();let paid=dbData.expenses.reduce((a,x)=>a+Number(x.amount||0),0)+dbData.workers.reduce((a,x)=>a+Number(x.paid||0),0)+dbData.trucks.reduce((a,x)=>a+Number(x.paid||0),0),received=dbData.sales.reduce((a,x)=>a+Number(x.received||0),0),yearEx=dbData.expenses.filter(x=>String(x.date||'').startsWith(String(y))).reduce((a,x)=>a+Number(x.amount||0),0);return `<h2>设置</h2><div class="notice">设置是全局的，不属于某一块项目。这里可以看全年和所有项目的变化。</div><div class="stats"><div class="stat"><span>今年已记录支出</span><b>${money(yearEx)}</b></div><div class="stat"><span>全部已付</span><b>${money(paid)}</b></div><div class="stat"><span>全部已收</span><b>${money(received)}</b></div></div><div class="list"><button class="item" onclick="view='profile';render()"><div><div class="item-title">我的资料</div><div class="item-sub">姓名、电话和常用联系人</div></div><span>→</span></button><div class="item"><div><div class="item-title">数据保存</div><div class="item-sub">所有文字保存在本机浏览器，不上传服务器</div></div><span>本地</span></div><div class="item"><div><div class="item-title">自定义填写</div><div class="item-sub">每条记录都可以用备注写自己的名称和场景</div></div><span>可自定义</span></div><div class="item"><div><div class="item-title">外观和背景</div><div class="item-sub">顶部按钮可切换浅色、深色和背景动效</div></div><span>已开启</span></div></div>`}
function profileView(){let d=JSON.parse(localStorage.getItem('shanmu-profile')||'{}');return `<h2>我的资料</h2><div class="notice">只保存在本机浏览器，不会写入网址。</div><form class="form" id="profileForm"><div class="row"><div class="field"><label>姓名</label><input name="name" value="${esc(d.name||'')}" placeholder="例如：姓名"></div><div class="field"><label>电话</label><input name="phone" value="${esc(d.phone||'')}" placeholder="联系电话"></div></div><div class="field"><label>常用联系人</label><input name="contacts" value="${esc(d.contacts||'')}" placeholder="工人、车老板或收购方"></div><div class="field"><label>备注</label><textarea name="note" rows="3" placeholder="其他说明">${esc(d.note||'')}</textarea></div><div class="actions"><button class="btn">保存资料</button><button type="button" class="btn ghost" onclick="view='settings';render()">返回设置</button></div></form>`}
function overview(p,s){return `<h2>${esc(p.name)} <span class="badge">${esc(p.status)}</span></h2><div class="item-sub">${esc(p.location||'未填地点')} · 合同：${esc(p.contractNo||'未填')}</div><div class="stats" style="margin-top:14px"><div class="stat"><span>已投入</span><b>${money(s.cost)}</b></div><div class="stat"><span>已卖出</span><b>${money(s.income)}</b></div><div class="stat"><span>账面盈亏</span><b>${money(s.profit)}</b></div></div><div class="item ${s.due>0?'due':''}" style="margin-top:12px"><div><div class="item-title">待收尾款</div><div class="item-sub">${s.due>0?'还有木款没有收齐':'目前没有未收尾款'}</div></div><strong class="money">${money(s.due)}</strong></div><h3>合同与手续</h3><div class="notice">山主：${esc(p.owner||'未填')}　签约：${esc(p.date||'未填')}<br>${esc(p.note||'还没有补充说明')}</div><div class="actions"><button class="btn ghost" onclick="view='expense';render()">+ 记一笔支出</button><button class="btn ghost" onclick="view='work';render()">+ 记工人/运输</button><button class="btn ghost" onclick="view='sale';render()">+ 记一车木</button><button class="btn ghost" onclick="openMedia('${p.id}')">+ 加照片/视频</button></div>`}
function expenseForm(p){return `<h2>记一笔支出</h2><div class="notice">这笔钱属于“${esc(p.name)}”，保存后会自动算进这块地。</div><form class="form" id="expenseForm"><div class="row"><div class="field"><label>日期</label><input type="date" name="date" value="${today()}"></div><div class="field"><label>金额 *</label><input type="number" min="0" step="0.01" name="amount" required placeholder="元"></div></div><div class="field"><label>花在什么地方 *</label><select name="type"><option>林木购置/承包款</option><option>地块押金</option><option>伐区设计服务费</option><option>山路修整</option><option>挖机柴油</option><option>挖机维修/保养</option><option>其他</option></select></div><div class="field"><label>说明（可不填）</label><input name="note" placeholder="例如：给哪位师傅、哪次加油"></div><div class="actions"><button class="btn">保存支出</button><button type="button" class="btn ghost" onclick="view='overview';render()">返回总览</button></div></form><h3>最近支出</h3>${dbData.expenses.filter(x=>x.plotId===p.id).slice(-8).reverse().map(x=>`<div class="item"><div><div class="item-title">${esc(x.type)}</div><div class="item-sub">${x.date||''} ${esc(x.note||'')}</div></div><strong>${money(x.amount)}</strong></div>`).join('')||'<div class="empty">还没有支出</div>'}`}
function workForm(p){return `<h2>工人和外部运输</h2><div class="tabs"><button class="tab on" type="button">先选下面要记录的事情</button></div><form class="form" id="workForm"><div class="field"><label>记录类型</label><select name="kind" id="workKind"><option value="worker">工人工资</option><option value="truck">外部卡车运费</option></select></div><div class="row"><div class="field"><label>姓名/老板</label><input name="person" placeholder="例如：阿三师傅、某某车老板" required></div><div class="field"><label>日期</label><input type="date" name="date" value="${today()}"></div></div><div class="row"><div class="field"><label>工种/去向</label><input name="role" placeholder="砍伐、搬运、运到某工厂"></div><div class="field"><label>车牌（运输可填）</label><input name="plate" placeholder="选填"></div></div><div class="row"><div class="field"><label>应付金额 *</label><input type="number" min="0" step="0.01" name="amount" required placeholder="元"></div><div class="field"><label>已付金额</label><input type="number" min="0" step="0.01" name="paid" value="0"></div></div><div class="field"><label>说明</label><input name="note" placeholder="按天、按车、包工或其他约定"></div><div class="actions"><button class="btn">保存记录</button><button type="button" class="btn ghost" onclick="view='overview';render()">返回总览</button></div></form><h3>未结清</h3>${[...dbData.workers.filter(x=>x.plotId===p.id).map(x=>({...x,label:'工人工资'})),...dbData.trucks.filter(x=>x.plotId===p.id).map(x=>({...x,label:'卡车运费'}))].filter(x=>Number(x.amount||0)>Number(x.paid||0)).map(x=>`<div class="item due"><div><div class="item-title">${esc(x.person)} · ${x.label}</div><div class="item-sub">${esc(x.role||'')}</div></div><strong>${money(Number(x.amount)-Number(x.paid))}</strong></div>`).join('')||'<div class="empty">目前没有未结清记录</div>'}`}
function saleForm(p){return `<h2>记一车木和尾款</h2><form class="form" id="saleForm"><div class="row"><div class="field"><label>出车日期</label><input type="date" name="date" value="${today()}"></div><div class="field"><label>挂车车牌</label><input name="plate" placeholder="选填"></div></div><div class="row"><div class="field"><label>收购老板/工厂</label><input name="buyer" required placeholder="谁收了这车木"></div><div class="field"><label>方量（可不填）</label><input type="number" min="0" step="0.01" name="volume" placeholder="方"></div></div><div class="row"><div class="field"><label>单价（可不填）</label><input type="number" min="0" step="0.01" name="unit" placeholder="元/方"></div><div class="field"><label>本车应收总价 *</label><input type="number" min="0" step="0.01" name="total" required placeholder="元"></div></div><div class="row"><div class="field"><label>已收到</label><input type="number" min="0" step="0.01" name="received" value="0"></div><div class="field"><label>备注</label><input name="note" placeholder="例如：约定月底结清"></div></div><div class="actions"><button class="btn">保存这车木</button><button type="button" class="btn ghost" onclick="view='overview';render()">返回总览</button></div></form><h3>待收尾款</h3>${dbData.sales.filter(x=>x.plotId===p.id).slice().reverse().map(x=>{let d=Number(x.total)-Number(x.received);return `<div class="item ${d>0?'due':''}"><div><div class="item-title">${esc(x.buyer)} · ${esc(x.plate||'无车牌')}</div><div class="item-sub">${x.date||''} · 应收 ${money(x.total)}</div></div><strong>${d>0?`还欠 ${money(d)}`:'已结清'}</strong></div>`}).join('')||'<div class="empty">还没有销售记录</div>'}`}
function mediaView(p){return `<h2>现场照片和视频</h2><div class="notice">用于记录合同、砍伐、装车和交货现场。文件留在本机，不会上传。</div><div class="actions"><button class="btn" onclick="openMedia('${p.id}')">+ 添加照片/视频</button></div><div class="media-grid" style="margin-top:14px">${dbData.media.filter(x=>x.plotId===p.id).map(x=>`<div class="media"><div id="m-${x.id}"></div><small>${esc(x.note||'无说明')}<br>${x.date||''}</small></div>`).join('')||'<div class="empty">还没有现场资料</div>'}</div>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('#moreBtn').onclick=()=>moreDialog.showModal();$('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem(themeKey,document.body.classList.contains('dark')?'dark':'light')};$('#paletteBtn').onclick=()=>$('#accentPicker').click();const bgKey='shanmu-background';const ambient=$('#ambient');if(localStorage.getItem(bgKey)==='off')ambient.style.display='none';$('#backgroundBtn').onclick=()=>{const on=ambient.style.display==='none';ambient.style.display=on?'block':'none';localStorage.setItem(bgKey,on?'on':'off');$('#backgroundBtn').querySelector('span:last-child').textContent=on?'动态':'关闭'};$('#accentPicker').oninput=e=>{document.documentElement.style.setProperty('--brand',e.target.value);localStorage.setItem('shanmu-accent',e.target.value)}
$('#addPlotBtn').onclick=()=>plotDialog.showModal();$('#plotForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),p=Object.fromEntries(f);p.id=id();dbData.plots.push(p);selectedId=p.id;save();plotDialog.close();e.target.reset()};$('#main').addEventListener('submit',e=>{if(e.target.id==='profileForm'){e.preventDefault();localStorage.setItem('shanmu-profile',JSON.stringify(Object.fromEntries(new FormData(e.target))));alert('资料已保存');view='settings';render()}if(e.target.id==='expenseForm'){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));dbData.expenses.push({id:id(),plotId:selectedId,...f});save()}if(e.target.id==='workForm'){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let row={id:id(),plotId:selectedId,person:f.person,role:f.role,plate:f.plate,date:f.date,amount:Number(f.amount),paid:Number(f.paid||0),note:f.note};(f.kind==='worker'?dbData.workers:dbData.trucks).push(row);save()}if(e.target.id==='saleForm'){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));dbData.sales.push({id:id(),plotId:selectedId,...f,total:Number(f.total),received:Number(f.received||0)});save()}});
let idb;function openDb(){return new Promise((res,rej)=>{let r=indexedDB.open('shanmu-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>{idb=r.result;res(idb)};r.onerror=()=>rej(r.error)})};async function openMedia(plotId){$('#mediaForm').dataset.plotId=plotId;mediaDialog.showModal()}$('#mediaForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),file=f.get('file');if(!file)return;await openDb();let rec={id:id(),plotId:e.target.dataset.plotId,name:file.name,note:f.get('note'),date:today(),type:file.type};idb.transaction('files','readwrite').objectStore('files').put({...rec,blob:file});dbData.media.push(rec);save();mediaDialog.close();e.target.reset();setTimeout(loadMedia,100)};async function loadMedia(){if(!idb)await openDb();for(const x of dbData.media){let r=idb.transaction('files').objectStore('files').get(x.id);r.onsuccess=()=>{if(!r.result)return;let url=URL.createObjectURL(r.result.blob),el=document.querySelector('#m-'+x.id);if(el)el.innerHTML=r.result.type.startsWith('video')?`<video controls src="${url}"></video>`:`<img src="${url}" alt="现场资料">`}}}$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(dbData,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='杉木经营台账备份-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.plots||!Array.isArray(d.plots))throw Error();dbData=d;selectedId=dbData.plots[0]?.id||null;save();alert('备份已导入')}catch{alert('文件不是有效的台账备份')}};r.readAsText(file)};render();openDb().then(loadMedia);
</script>
<script>
(()=>{const c=document.getElementById('ambient'),x=c.getContext('2d');let w,h,pts=[];const reduced=matchMedia('(prefers-reduced-motion: reduce)');function resize(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);pts=Array.from({length:42},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2.6+1.4,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.14}))}function draw(){x.clearRect(0,0,innerWidth,innerHeight);const color=getComputedStyle(document.documentElement).getPropertyValue('--brand')||'#16634c';x.fillStyle=color+'88';for(const p of pts){x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();if(!reduced.matches){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>innerWidth)p.vx*=-1;if(p.y<0||p.y>innerHeight)p.vy*=-1}}if(!reduced.matches)requestAnimationFrame(draw)}addEventListener('resize',resize);resize();draw()})()
</script>
</body></html>
